<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoreLabGlobal AI - Autonomous Business Accelerator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0a0a0a;
      color: #e5e5e5;
    }
    .cta-button-animation {
      animation: pulse-glow 4s infinite ease-in-out;
    }
    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(163, 230, 53, 0.2), 0 0 40px rgba(74, 222, 128, 0.3);
      }
      50% {
        box-shadow: 0 0 40px rgba(163, 230, 53, 0.3), 0 0 60px rgba(74, 222, 128, 0.5);
      }
    }
    .line-draw {
      animation: draw-line 1.s 0.5s ease-out forwards;
    }
    @keyframes draw-line {
      from { width: 0%; }
      to { width: 100%; }
    }
    .icon-pulse {
        animation: pulse-icon 3s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }
    @keyframes pulse-icon {
        0%, 100% {
            transform: scale(1);
            filter: drop-shadow(0 0 3px rgba(134, 239, 172, 0.4));
        }
        50% {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(134, 239, 172, 0.7));
        }
    }
  </style>
